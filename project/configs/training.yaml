# ============================================================
# SmartFeedback — параметры обучения
# Переопределяют соответствующие блоки из config.yaml
# (используйте, если хотите запускать эксперименты отдельно)
# ============================================================

baseline:
  max_features: 100000            # расширенный словарь для экспериментов
  ngram_range: [1, 3]
  C: 5.0

bert:
  max_length: 128
  num_train_epochs: 5
  per_device_train_batch_size: 16  # уменьшить при нехватке RAM/VRAM
  per_device_eval_batch_size: 32
  learning_rate: 3.0e-5

# Целевая метрика для ранней остановки
target_f1_macro: 0.80
